domain: supply_chain
alias: Equipment_Quality_Data_Load
discoveryPort:
  name: Equipment Quality Impact Assessment
inputPorts:
  - alias: Shop_360_1
    isDynamic: true
    dataProductUrn: urn:dv:dataproduct:a61f5afc-5f6d-45b9-b160-72c236492bdc
    filter: ""
    projection: ""
    optional:
      persistDataFrame: false
    type: dataproduct
productState:
  isDynamic: true
  alias: Equipment_Quality_Data_Load
  retentionVersions: ""
  logicalSchema:
    properties:
      UNITS:
        type: STRING
        description: Measurement unit of the rejected quantity (e.g., kg, L).
        sourceColumn: UNITS
        sourceTable: Shop 360
      EQP_ID:
        type: STRING
        description: Unique identifier for the equipment.
        sourceColumn: CUSTOMID
        sourceTable: Shop 360
      SHOP_ID:
        type: STRING
        description: Unique identifier for the shop or manufacturing area.
        sourceColumn: CUSTOMID
        sourceTable: Shop 360
      BATCH_ID:
        type: STRING
        description: Unique identifier for a batch.
        sourceColumn: BATCH
        sourceTable: Shop 360
      EQP_NAME:
        type: STRING
        description: Name of the equipment (e.g., FBD-01, Blender-02).
        sourceColumn: EQMNAME
        sourceTable: Shop 360
      EQP_TYPE:
        type: STRING
        description: Type/category of equipment (e.g., Dryer, Mixer).
        sourceColumn: EQP_TYPE
        sourceTable: Shop 360
      REJECT_DATE:
        type: DATETIME
        description: Date when the rejection occurred during the production process.
        sourceColumn: REJECT_DATE
        sourceTable: Shop 360
      PRODUCT_CODE:
        type: STRING
        description: Unique identifier for the product processed on the equipment.
        sourceColumn: INPUTMATERIALNAME
        sourceTable: Shop 360
      REJECT_REASON:
        type: STRING
        description: Reason for rejecting the batch or material (e.g., Quality Issue,
          Contamination).
        sourceColumn: REJECT_REASON
        sourceTable: Shop 360
      REJECT_QUANTITY:
        type: STRING
        description: Quantity of the rejected material or product.
        sourceColumn: REJECT_QUANTITY
        sourceTable: Shop 360
      REJECTION_SEVERITY:
        type: STRING
        description: Classifies reject quantity severity as Low, Medium, or High.
        sourceColumn: REJECTION_SEVERITY
        sourceTable: Shop 360
      DAYS_SINCE_MAINTENANCE:
        type: STRING
        description: Number of days since last maintenance before rejection occurred.
        sourceColumn: DAYS_SINCE_MAINTENANCE
        sourceTable: Shop 360
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: iceberg_meta.equipment_quality_impact_assessment
  warehousePath: s3a://bp-spark-sql-library-test-acc/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: false
    enforceSchemaMethod: Warning
    catalogType: postgres
    loggingOptions:
      printSchema: true
      count: true
      showData: true
  refreshInterval: None
transformation:
  - isDynamic: true
    alias: Filtered_Rejects
    description: Filtered_Rejects
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: Shop_360_1
        tempViewName: Shop360
    query: SELECT * FROM Shop360 WHERE REJECT_DATE >= DATE_SUB(CURRENT_DATE(), 600)
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Filtered_Maintenance
    description: Filtered_Maintenance
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Shop_360_1
        tempViewName: Shop360
    query: SELECT EQP_ID, MAINT_DATE FROM Shop360 WHERE MAINT_DATE IS NOT NULL
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Equipment_Quality_Logic
    description: Equipment_Quality_Logic
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Filtered_Rejects
        tempViewName: Filtered_Rejects
      - inputDataFrame: Filtered_Maintenance
        tempViewName: Filtered_Maintenance
    query: SELECT r.EQP_ID, r.EQP_NAME, r.EQP_TYPE, r.SHOP_ID, r.BATCH_ID,
      r.PRODUCT_CODE, r.REJECT_DATE, r.REJECT_REASON, r.REJECT_QUANTITY,
      r.UNITS, MAX(DATEDIFF(r.REJECT_DATE, m.MAINT_DATE)) AS
      DAYS_SINCE_MAINTENANCE, CASE WHEN r.REJECT_QUANTITY > 100 THEN 'High' WHEN
      r.REJECT_QUANTITY > 50 THEN 'Medium' ELSE 'Low' END AS REJECTION_SEVERITY
      FROM Filtered_Rejects r LEFT JOIN Filtered_Maintenance m ON r.EQP_ID =
      m.EQP_ID AND m.MAINT_DATE < r.REJECT_DATE GROUP BY r.EQP_ID, r.EQP_NAME,
      r.EQP_TYPE, r.SHOP_ID, r.BATCH_ID, r.PRODUCT_CODE, r.REJECT_DATE,
      r.REJECT_REASON, r.REJECT_QUANTITY, r.UNITS
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules: {}
