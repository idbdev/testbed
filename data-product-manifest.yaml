transformation:
  - isDynamic: true
    alias: Base_Data
    description: base_data
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: Shop_360_1
        tempViewName: Shop360
    query: SELECT EQP_ID ,EQP_NAME ,EQP_TYPE ,SHOP_ID ,SHOP_NAME ,PRODUCT_CODE
      ,REJECT_REASON ,REJECT_QUANTITY ,UNITS ,REJECT_DATE ,CASE WHEN UNITS =
      'KG' THEN REJECT_QUANTITY * 250 WHEN UNITS = 'L' THEN REJECT_QUANTITY *
      175 ELSE REJECT_QUANTITY * 50 END AS ESTIMATED_REJECT_COST ,CASE WHEN
      REJECT_REASON LIKE '%EQUIPMENT%' THEN 'Equipment-Related' WHEN
      REJECT_REASON LIKE '%PROCESS%' THEN 'Process-Related' WHEN REJECT_REASON
      LIKE '%MATERIAL%' THEN 'Material-Related' ELSE 'Other' END AS
      REJECTION_CATEGORY FROM Shop360 WHERE REJECT_DATE >= DATE_SUB(CURRENT_DATE
      (), 180)
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Recent_Counts
    description: recent_counts
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Shop_360_1
        tempViewName: Shop360
    query: SELECT EQP_ID ,REJECT_DATE ,COUNT(*) AS RECENT_REJECTION_COUNT FROM
      Shop360 WHERE REJECT_DATE >= DATE_SUB(CURRENT_DATE (), 180) GROUP BY
      EQP_ID ,REJECT_DATE
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Average_Rejects
    description: avg_rejects
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Shop_360_1
        tempViewName: Shop360
    query: SELECT REJECT_REASON ,AVG(REJECT_QUANTITY) AS AVG_REJECT_QUANTITY FROM
      Shop360 WHERE REJECT_DATE >= DATE_SUB(CURRENT_DATE (), 180) GROUP BY
      REJECT_REASON
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Production_Rejection_Logic
    description: Production Rejection Logic
    sequence: 5
    inputDataFrameList:
      - inputDataFrame: Base_Data
        tempViewName: base_data
      - inputDataFrame: Recent_Counts
        tempViewName: recent_counts
      - inputDataFrame: Average_Rejects
        tempViewName: avg_rejects
    query: SELECT DISTINCT b.EQP_ID ,b.EQP_NAME ,b.EQP_TYPE ,b.SHOP_ID ,b.SHOP_NAME
      ,b.PRODUCT_CODE ,b.REJECT_REASON ,b.REJECT_QUANTITY ,b.UNITS
      ,b.ESTIMATED_REJECT_COST ,b.REJECTION_CATEGORY
      ,COALESCE(rc.RECENT_REJECTION_COUNT, 0) AS RECENT_REJECTION_COUNT ,CASE
      WHEN b.REJECT_QUANTITY > COALESCE(ar.AVG_REJECT_QUANTITY, 0) THEN 'High
      Priority' ELSE 'Normal' END AS IMPROVEMENT_PRIORITY FROM base_data b LEFT
      JOIN recent_counts rc ON b.EQP_ID = rc.EQP_ID AND b.REJECT_DATE =
      rc.REJECT_DATE LEFT JOIN avg_rejects ar ON b.REJECT_REASON =
      ar.REJECT_REASON
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules: {}
