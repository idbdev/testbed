transformation:
  - isDynamic: true
    alias: LATEST_STATUS_DATE
    description: LATEST_STATUS_DATE
    sequence: 9
    inputDataFrameList:
      - inputDataFrame: EQUIPMENTSTATUS_1
        tempViewName: EQUIPMENTSTATUS
    query: SELECT CUSTOMID, MAX(STATUS_DATE) AS MAX_STATUS_DATE FROM EQUIPMENTSTATUS
      GROUP BY CUSTOMID
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: LATEST_AVAIL_DATE
    description: LATEST_AVAIL_DATE
    sequence: 10
    inputDataFrameList:
      - inputDataFrame: PR_EBR_AVAILABLE_MAT_IN_ITEM_1
        tempViewName: PR_EBR_AVAILABLE_MAT_IN_ITEM
    query: SELECT EQUIPMENTID, MAX(AVAIL_DATE) AS MAX_AVAIL_DATE FROM
      PR_EBR_AVAILABLE_MAT_IN_ITEM GROUP BY EQUIPMENTID
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
  - isDynamic: true
    alias: Transformation_logic
    description: Transformation_logic
    sequence: 11
    inputDataFrameList:
      - inputDataFrame: VSHOPFLOORORDER_1
        tempViewName: VSHOPFLOORORDER
      - inputDataFrame: PASXEQUIPMENT_1
        tempViewName: PASXEQUIPMENT
      - inputDataFrame: EQUIPMENTSTATUS_1
        tempViewName: EQUIPMENTSTATUS
      - inputDataFrame: EDI_EQM_EQMLOG_1
        tempViewName: EDI_EQM_EQMLOG
      - inputDataFrame: VPASXEQMCOUNTERMAINTENANCE_1
        tempViewName: VPASXEQMCOUNTERMAINTENANCE
      - inputDataFrame: PR_EBR_AVAILABLE_MAT_IN_ITEM_1
        tempViewName: PR_EBR_AVAILABLE_MAT_IN_ITEM
      - inputDataFrame: PASXPRODUCTIONUNIT_1
        tempViewName: PASXPRODUCTIONUNIT
      - inputDataFrame: VBATCHRECORDREPORT_1
        tempViewName: VBATCHRECORDREPORT
      - inputDataFrame: LATEST_STATUS_DATE
        tempViewName: LATEST_STATUS_DATE
      - inputDataFrame: LATEST_AVAIL_DATE
        tempViewName: LATEST_AVAIL_DATE
    query: SELECT sm.CUSTOMID AS SHOP_ID ,sm.DESCRIPTION AS SHOP_NAME
      ,sm.SPECIFICATIONTYPE AS AREA_TYPE ,em.CUSTOMID AS EQP_ID ,em.EQMNAME AS
      EQP_NAME ,em.EQP_TYPE ,em.REMSTORAGEUNIT AS CAPACITY ,es.ISUSABLE AS
      STATUS ,eat.AVAIL_DATE ,eat.SCHEDULED_HOURS ,eat.UNPLANNED_DOWNTIME
      ,eat.AVAILABLE_HOURS ,eat.UTILIZATION_PERCENT ,el.INPUTBATCH AS BATCH_ID
      ,el.INPUTMATERIALNAME AS PRODUCT_CODE ,bea.STATUS AS PROCESS_STEP
      ,bea.ACTUALSTART AS START_TIME ,bea.ACTUALEND AS END_TIME
      ,ROUND((unix_timestamp(bea.ACTUALEND) - unix_timestamp(bea.ACTUALSTART)) /
      60, 1) AS DURATION_MINUTES ,el.USERNAME AS OPERATOR ,LAG(bea.ACTUALEND)
      OVER ( PARTITION BY em.CUSTOMID ORDER BY bea.ACTUALSTART ) AS
      PREV_OPERATION_END ,( unix_timestamp(bea.ACTUALSTART) -
      unix_timestamp(LAG(bea.ACTUALEND) OVER ( PARTITION BY em.CUSTOMID ORDER BY
      bea.ACTUALSTART )) ) / 60 AS EQUIPMENT_IDLE_MINUTES ,pr.REJECT_DATE
      ,pr.REJECT_REASON ,pr.REJECT_QUANTITY ,pr.UNITS ,emt.MAINT_DATE FROM
      VSHOPFLOORORDER sm JOIN PASXEQUIPMENT em ON sm.CUSTOMID = em.SHOP_ID JOIN
      EDI_EQM_EQMLOG el ON el.EQUIPMENTCUSTOMID = em.CUSTOMID JOIN
      EQUIPMENTSTATUS es ON em.CUSTOMID = es.CUSTOMID JOIN LATEST_STATUS_DATE
      lsd ON es.CUSTOMID = lsd.CUSTOMID AND es.STATUS_DATE = lsd.MAX_STATUS_DATE
      LEFT JOIN PR_EBR_AVAILABLE_MAT_IN_ITEM eat ON em.CUSTOMID =
      eat.EQUIPMENTID JOIN LATEST_AVAIL_DATE lad ON eat.EQUIPMENTID =
      lad.EQUIPMENTID AND eat.AVAIL_DATE = lad.MAX_AVAIL_DATE JOIN
      VBATCHRECORDREPORT bea ON bea.EQUIPMENT = em.CUSTOMID AND bea.LOG_ID =
      el.LOG_ID JOIN PASXPRODUCTIONUNIT pr ON pr.LOG_ID = el.LOG_ID AND
      pr.EQP_ID = em.CUSTOMID JOIN VPASXEQMCOUNTERMAINTENANCE emt ON emt.EQP_ID
      = em.CUSTOMID
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: SHOP_ID
          - column: EQP_ID
        referenceAlias: Load_data
    UnacceptableTextValueCheck:
      productState:
        checks:
          - column: STATUS
            valueList:
              - In Use
              - Available
              - Maintenance
              - Down
              - Qualification
        referenceAlias: Load_data
    UniquenessCheck:
      inputPort:
        - checks:
            - column: CUSTOMID
          referenceAlias: VSHOPFLOORORDER_1
