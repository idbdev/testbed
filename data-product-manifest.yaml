jobId: "1069"
jobName: raw_well_telemetry
jobType: DataSets
developerId: 7679c14a-8908-42a5-8656-2abecbfa4b49
domain: business
alias: load_into_iceberg
discoveryPort:
  name: raw_well_telemetry
inputPorts: []
productState:
  isDynamic: true
  alias: load_into_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      asset_id:
        type: STRING
        description: Unique identifier of the oil & gas asset (well, pipeline, or rig)
        sourceColumn: asset_id
        sourceTable: kafka.oil_gas_events
      event_time:
        type: DATETIME
        description: Timestamp when the sensor event was generated at the source system
        sourceColumn: event_time
        sourceTable: kafka.oil_gas_events
      pressure_psi:
        type: STRING
        description: Measured pressure value in pounds per square inch (PSI)
        sourceColumn: pressure_psi
        sourceTable: kafka.oil_gas_events
      temperature_c:
        type: STRING
        description: Measured temperature in degrees Celsius
        sourceColumn: temperature_c
        sourceTable: kafka.oil_gas_events
      flow_rate_bpd:
        type: STRING
        description: Oil or gas flow rate measured in barrels per day (BPD)
        sourceColumn: flow_rate_bpd
        sourceTable: kafka.oil_gas_events
      status:
        type: STRING
        description: Operational status derived from sensor readings (NORMAL, WARNING,
          CRITICAL)
        sourceColumn: status
        sourceTable: kafka.oil_gas_events
      source_system:
        type: STRING
        description: Originating system or IoT gateway that produced the event
        sourceColumn: source_system
        sourceTable: kafka.oil_gas_events
      batchId:
        type: STRING
        description: Spark Structured Streaming batch identifier for traceability
        sourceColumn: batchId
        sourceTable: spark.streaming_runtime
      high_pressure_flag:
        type: STRING
        description: Derived flag indicating whether pressure exceeds the defined safety
          threshold
        sourceColumn: high_pressure_flag
        sourceTable: spark.derived_column
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Append
  tableName: iceberg_meta.raw_well_telemetry
  warehousePath: s3a://dataverse/testbed/oil_gas/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: true
    enforceSchemaMethod: Warning
    catalogType: postgres
    connection: S3 Connection
    loggingOptions:
      printSchema: true
      count: true
      showData: true
  refreshInterval: 30 05 * * *
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: data transformation
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: Kafka_1
        tempViewName: well_stream
    query: SELECT asset_id, to_timestamp(event_time) AS event_time, pressure_psi,
      temperature_c, flow_rate_bpd, status, source_system, batchId, CASE WHEN
      pressure_psi > 4000 THEN true ELSE false END AS high_pressure_flag FROM
      well_stream WHERE status = 'RUNNING'
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules: {}
