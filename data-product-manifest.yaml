jobId: "1171"
jobName: Customer 360
jobType: Source Aligned Data Product
jobSubType: streaming
developerId: e3177aef-f9f9-4f45-b0a7-a46ea5466170
domain: business
alias: loading_rt_data
discoveryPort:
  name: Customer 360
inputPorts: []
streamingInputPorts:
  - alias: kafka_ds_1
    isDynamic: true
    connection: kafka connection
    topics:
      - test-topic
    schema:
      - columnName: name
        dataType: String
        nullable: true
      - columnName: age
        dataType: String
        nullable: true
      - columnName: city
        dataType: String
        nullable: true
      - columnName: occupation
        dataType: String
        nullable: true
      - columnName: ts
        dataType: String
        nullable: true
    optional:
      advanceOptions:
        failOnDataLoss: true
    type: kafkaStream
    sequence: 1
productState:
  isDynamic: true
  alias: loading_rt_data
  retentionVersions: ""
  logicalSchema:
    properties:
      name:
        type: STRING
        description: Name of the user
        sourceColumn: Name
        sourceTable: public.data_1
      age:
        type: STRING
        description: Age of the user
        sourceColumn: Age
        sourceTable: public.data_1
      city:
        type: STRING
        description: Location of the user
        sourceColumn: City
        sourceTable: public.data_1
      occupation:
        type: STRING
        description: Profession of the user
        sourceColumn: Occupation
        sourceTable: public.data_1
      ts:
        type: STRING
        description: ts of the user
        sourceColumn: ts
        sourceTable: public.data_1
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Append
  tableName: iceberg_meta.customerrt
  warehousePath: s3a://dataverse/testbedLoad
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: false
    enforceSchemaMethod: Warning
    catalogType: postgres
    connection: S3 Connection
  refreshInterval: None
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: transforming rt data
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: kafka_ds_1
        tempViewName: tmp
    query: select * from tmp
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: name
        referenceAlias: loading_rt_data
    UniquenessCheck:
      productState:
        checks:
          - column: ts
        referenceAlias: loading_rt_data
