productState:
  isDynamic: true
  alias: Load_data_in_production
  retentionVersions: ""
  logicalSchema:
    properties:
      UNITS:
        type: STRING
        description: Unit of measurement for the rejection quantity (e.g., kg, L).
        sourceColumn: UNITS
        sourceTable: Shop 360
      EQP_ID:
        type: STRING
        description: Unique identifier of the equipment where the rejection occurred.
        sourceColumn: EQP_ID
        sourceTable: Shop 360
      SHOP_ID:
        type: STRING
        description: Identifier of the shop or production unit where the rejection happened.
        sourceColumn: SHOP_ID
        sourceTable: Shop 360
      EQP_NAME:
        type: STRING
        description: Descriptive name of the equipment involved in the rejection.
        sourceColumn: EQP_NAME
        sourceTable: Shop 360
      EQP_TYPE:
        type: STRING
        description: Type/category of the equipment (e.g., Mixer, Filler).
        sourceColumn: EQP_TYPE
        sourceTable: Shop 360
      SHOP_NAME:
        type: STRING
        description: Name of the shop or production unit.
        sourceColumn: SHOP_NAME
        sourceTable: Shop 360
      REJECT_DATE:
        type: STRING
        description: Material or Product rejection date
        sourceColumn: REJECT_DATE
        sourceTable: Shop 360
      PRODUCT_CODE:
        type: STRING
        description: Code representing the product that was being processed or rejected.
        sourceColumn: PRODUCT_CODE
        sourceTable: Shop 360
      REJECT_REASON:
        type: STRING
        description: Reason for product or material rejection (e.g., out-of-spec, damage).
        sourceColumn: REJECT_REASON
        sourceTable: Shop 360
      REJECT_QUANTITY:
        type: STRING
        description: Quantity of rejected material or product.
        sourceColumn: REJECT_QUANTITY
        sourceTable: Shop 360
      REJECTION_CATEGORY:
        type: STRING
        description: Categorization of the rejection (e.g., Quality, Mechanical Failure).
        sourceColumn: REJECTION_CATEGORY
        sourceTable: Shop 360
      AVG_REJECT_QUANTITY:
        type: STRING
