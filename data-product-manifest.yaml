productState:
  isDynamic: true
  alias: loading_data_of_consumer_insight_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      Transaction_Id:
        type: STRING
        description: Unique identifier for the transaction
        sourceColumn: TransactionId
        sourceTable: Transaction
      Transaction_Date:
        type: STRING
        description: Date of the transaction
        sourceColumn: TransactionDate
        sourceTable: Transaction
      Product_Id:
        type: STRING
        description: Unique identifier for the product sold
        sourceColumn: ProductId
        sourceTable: Transaction / Traffic
      Quantity_Sold:
        type: STRING
        description: Quantity of the product sold
        sourceColumn: QuantitySold
        sourceTable: Transaction
      Sale_Price:
        type: STRING
        description: Price of the product at the time of sale
        sourceColumn: SalePrice
        sourceTable: Transaction
      Total_Amount:
        type: STRING
        description: Total amount for the transaction
        sourceColumn: TotalAmount
        sourceTable: Transaction
      Customer_Id:
        type: STRING
        description: Unique identifier for the customer
        sourceColumn: CustomerId
        sourceTable: Customer
      First_Purchase_Date:
        type: STRING
        description: Date when the customer made their first purchase
        sourceColumn: FirstPurchaseDate
        sourceTable: Customer
      Last_Purchase_Date:
        type: STRING
        description: Date when the customer made their most recent purchase
        sourceColumn: LastPurchaseDate
        sourceTable: Customer
      Visit_Id:
        type: STRING
        description: Unique identifier for the visit
        sourceColumn: VisitId
        sourceTable: Traffic
      Visit_Date:
        type: STRING
        description: Date of the visit
        sourceColumn: VisitDate
        sourceTable: Traffic
      Source:
        type: STRING
        description: Source from where the visit originated (e.g., organic, paid)
        sourceColumn: Source
        sourceTable: Traffic
      Campaign_Id:
        type: STRING
        description: Campaign identifier for marketing initiatives
        sourceColumn: CampaignId
        sourceTable: Traffic / MarketingSpend
      Budget_Amount:
        type: STRING
        description: Marketing budget allocated to the campaign
        sourceColumn: BudgetAmount
        sourceTable: MarketingSpend
      Available_Stock:
        type: STRING
        description: Amount of stock available for sale
        sourceColumn: AvailableStock
        sourceTable: InventoryMovement / MaterialMaster
      Opening_Stock:
        type: STRING
        description: Stock available at the beginning of the period
        sourceColumn: OpeningStock
        sourceTable: InventoryMovement
      Closing_Stock:
        type: STRING
        description: Stock remaining at the end of the period
        sourceColumn: ClosingStock
        sourceTable: InventoryMovement
      Standard_Cost:
        type: STRING
        description: Standard cost of the product
        sourceColumn: StandardCost
        sourceTable: MaterialMaster
      Is_Available:
        type: STRING
        description: Indicates whether the product is available for sale
        sourceColumn: IsAvailable
        sourceTable: MaterialMaster
      GMV:
        type: STRING
        description: Gross Merchandise Value (total sales value)
        sourceColumn: GMV
        sourceTable: MMCI.calculated
      Average_Order_Value:
        type: STRING
        description: Average value of an order
        sourceColumn: AverageOrderValue
        sourceTable: MMCI.calculated
      Conversion_Rate:
        type: STRING
        description: Rate of visitors who make a purchase
        sourceColumn: ConversionRate
        sourceTable: MMCI.calculated
      Customer_Acquisition_Cost:
        type: STRING
        description: Cost of acquiring a new customer
        sourceColumn: CustomerAcquisitionCost
        sourceTable: MMCI.calculated
      Customer_Lifetime_Value:
        type: STRING
        description: Total value a customer brings over their lifetime
        sourceColumn: CustomerLifetimeValue
        sourceTable: MMCI.calculated
      On_Shelf_Availability:
        type: STRING
        description: Percentage of time the product is available on shelf
        sourceColumn: OnShelfAvailability
        sourceTable: MMCI.calculated
      Inventory_Turnover:
        type: STRING
        description: Rate at which inventory is sold or used
        sourceColumn: InventoryTurnover
        sourceTable: MMCI.calculated
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: iceberg_meta.market_measurement
  warehousePath: s3a://dataverse/testbed_load/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: true
    enforceSchemaMethod: Warning
    catalogType: postgres
    loggingOptions:
      printSchema: true
      count: true
      showData: true
  refreshInterval: 30 5 * * *
transformation:
  - isDynamic: true
    alias: transforming_consumer_insights_data
    description: transforming data of consumer insight
    sequence: 6
    inputDataFrameList:
      - inputDataFrame: Customer_Acquisition_Cost_1
        tempViewName: cac
      - inputDataFrame: Traffic_1
        tempViewName: tf
      - inputDataFrame: Stock_Status_1
        tempViewName: stock
      - inputDataFrame: Customer_Master_1
        tempViewName: cm
      - inputDataFrame: Secondary_Sales_1
        tempViewName: ss
    query: select * from cm
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: Transaction_Id
        referenceAlias: loading_data_of_consumer_insight_in_iceberg
    UniqueCombinationCheck:
      productState:
        checks:
          - columns:
              - Transaction_Id
              - Product_Id
        referenceAlias: loading_data_of_consumer_insight_in_iceberg
