transformation:
  - isDynamic: true
    alias: transforming_data
    description: transforming customer acquisition cost data
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: New_Customer_1
        tempViewName: nc
      - inputDataFrame: Marketing_Spend_1
        tempViewName: ms
    query: select * from ms
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: operationThroughSqlQuery
