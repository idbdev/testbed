productState:
  isDynamic: true
  alias: loading_stock_status_data_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      Product_Id:
        type: STRING
        description: Unique identifier for the product
        sourceColumn: Product_Id
        sourceTable: inventory_movement
      Product_Name:
        type: STRING
        description: Name of the product
        sourceColumn: Product_Name
        sourceTable: material_master
      SKU:
        type: STRING
        description: Stock Keeping Unit (SKU) of the product
        sourceColumn: SKU
        sourceTable: material_master
      Material_Type:
        type: STRING
        description: Type of material the product is made of
        sourceColumn: Material_Type
        sourceTable: material_master
      Material_Group:
        type: STRING
        description: Group to which the material belongs
        sourceColumn: Material_Group
        sourceTable: material_master
      Warehouse_Id:
        type: STRING
        description: Unique identifier for the warehouse
        sourceColumn: Warehouse_Id
        sourceTable: inventory_movement
      Opening_Stock:
        type: STRING
        description: Initial stock quantity at the beginning of the period
        sourceColumn: Opening_Stock
        sourceTable: inventory_movement
      Available_Stock:
        type: STRING
        description: Stock available for sale or use
        sourceColumn: Available_Stock
        sourceTable: inventory_movement
      Closing_Stock:
        type: STRING
        description: Stock remaining at the end of the period
        sourceColumn: Closing_Stock
        sourceTable: inventory_movement
      Damaged_Stock:
        type: STRING
        description: Stock that has been damaged and cannot be sold
        sourceColumn: Damaged_Stock
        sourceTable: inventory_movement
      Movement_Type:
        type: STRING
        description: Type of inventory movement (e.g., inbound, outbound)
        sourceColumn: Movement_Type
        sourceTable: inventory_movement
      Quantity_Moved:
        type: STRING
        description: Quantity of the product moved in the transaction
        sourceColumn: Quantity_Moved
        sourceTable: inventory_movement
      Current_Stock:
        type: STRING
        description: The current available stock of the product
        sourceColumn: Current_Stock
        sourceTable: material_master
      Standard_Cost:
        type: STRING
        description: Standard cost per unit of the product
        sourceColumn: Standard_Cost
        sourceTable: material_master
      Expiry_Date:
        type: STRING
        description: Expiry date of the product (if applicable)
        sourceColumn: Expiry_Date
        sourceTable: inventory_movement
      Is_Available:
        type: STRING
        description: Indicates whether the product is available for sale or not
        sourceColumn: Is_Available
        sourceTable: material_master
      On_Shelf_Availability:
        type: STRING
        description: Indicates whether the product is available on shelves
        sourceColumn: On_Shelf_Availability
        sourceTable: calculated
      Inventory_Turnover_Rate:
        type: STRING
        description: Rate at which inventory is sold and replaced over a period
        sourceColumn: Inventory_Turnover_Rate
        sourceTable: calculated
      Last_Movement_Date:
        type: STRING
        description: Date of the last movement or transaction of the product
        sourceColumn: Last_Movement_Date
        sourceTable: calculated
      Stock_Value:
        type: STRING
        description: Total value of the product in stock (calculated as Quantity *
          Standard Cost)
        sourceColumn: Stock_Value
        sourceTable: calculated
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: iceberg_meta.stock_status
  warehousePath: s3a://dataverse/testbed_load/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: true
    enforceSchemaMethod: Warning
    catalogType: postgres
    loggingOptions:
      printSchema: true
      count: true
      showData: true
  refreshInterval: 30 5 * * *
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: transforming data
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Inventory_Movement_1
        tempViewName: im
      - inputDataFrame: Material_Master_1
        tempViewName: mm
    query: select * from mm
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: Product_Id
        referenceAlias: loading_stock_status_data_in_iceberg
    UniquenessCheck:
      productState:
        checks:
          - column: Product_Id
        referenceAlias: loading_stock_status_data_in_iceberg
