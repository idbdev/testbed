productState:
  isDynamic: true
  alias: Load_data
  retentionVersions: ""
  logicalSchema:
    properties:
      UNITS:
        type: STRING
        description: Measurement unit of the rejected quantity (e.g., kg, L).
        sourceColumn: UNITS
        sourceTable: PASX.PASXPRODUCTIONUNIT
      EQP_ID:
        type: STRING
        description: Unique identifier for the equipment.
        sourceColumn: CUSTOMID
        sourceTable: PASX.PASXEQUIPMENT
      STATUS:
        type: STRING
        description: Indicates whether the equipment is currently usable or not.
        sourceColumn: ISUSABLE
        sourceTable: PASX.EQUIPMENTSTATUS
      SHOP_ID:
        type: STRING
        description: Unique identifier for the shop or manufacturing area.
        sourceColumn: CUSTOMID
        sourceTable: PASX.VSHOPFLOORORDER
      BATCH_ID:
        type: STRING
        description: Identifier of the batch processed using the equipment.
        sourceColumn: INPUTBATCH
        sourceTable: PASX.EDI_EQM_EQMLOG
      CAPACITY:
        type: STRING
        description: Remaining or rated capacity of the equipment unit.
        sourceColumn: REMSTORAGEUNIT
        sourceTable: PASX.PASXEQUIPMENT
      END_TIME:
        type: DATETIME
        description: Actual end time of the process step.
        sourceColumn: ACTUALEND
        sourceTable: PASX.VBATCHRECORDREPORT
      EQP_NAME:
        type: STRING
        description: Name of the equipment (e.g., FBD-01, Blender-02).
        sourceColumn: EQMNAME
        sourceTable: PASX.PASXEQUIPMENT
      EQP_TYPE:
        type: STRING
        description: Type/category of equipment (e.g., Dryer, Mixer).
        sourceColumn: EQP_TYPE
        sourceTable: PASX.PASXEQUIPMENT
      OPERATOR:
        type: STRING
        description: Username of the operator who executed the batch operation.
        sourceColumn: USERNAME
        sourceTable: PASX.EDI_EQM_EQMLOG
      AREA_TYPE:
        type: STRING
        description: Specification type or category of the area (e.g., Granulation,
          Coating).
        sourceColumn: SPECIFICATIONTYPE
        sourceTable: PASX.VSHOPFLOORORDER
      SHOP_NAME:
        type: STRING
        description: Descriptive name of the shop or manufacturing area.
        sourceColumn: DESCRIPTION
        sourceTable: PASX.VSHOPFLOORORDER
      AVAIL_DATE:
        type: DATETIME
        description: Timestamp indicating when the equipment became available for use.
        sourceColumn: AVAIL_DATE
        sourceTable: PASX.PR_EBR_AVAILABLE_MAT_IN_ITEM
      MAINT_DATE:
        type: DATETIME
        description: Date when the last maintenance was performed on the equipment.
        sourceColumn: MAINT_DATE
        sourceTable: PASX.VPASXEQMCOUNTERMAINTENANCE
      START_TIME:
        type: DATETIME
        description: Actual start time of the process step.
        sourceColumn: ACTUALSTART
        sourceTable: PASX.VBATCHRECORDREPORT
      REJECT_DATE:
        type: DATETIME
        description: Date when the rejection occurred during the production process.
        sourceColumn: REJECT_DATE
        sourceTable: PASX.PASXPRODUCTIONUNIT
      PROCESS_STEP:
        type: STRING
        description: Status or phase of the current batch process (e.g., Running,
          Completed).
        sourceColumn: STATUS
        sourceTable: PASX.VBATCHRECORDREPORT
      PRODUCT_CODE:
        type: STRING
        description: Code representing the input material or product used in the batch.
        sourceColumn: INPUTMATERIALNAME
        sourceTable: PASX.EDI_EQM_EQMLOG
      REJECT_REASON:
        type: STRING
        description: Reason for rejecting the batch or material (e.g., Quality Issue,
          Contamination).
        sourceColumn: REJECT_REASON
        sourceTable: PASX.PASXPRODUCTIONUNIT
      AVAILABLE_HOURS:
        type: STRING
        description: Total hours the equipment was available for operation.
        sourceColumn: AVAILABLE_HOURS
        sourceTable: PASX.PR_EBR_AVAILABLE_MAT_IN_ITEM
      REJECT_QUANTITY:
        type: STRING
        description: Quantity of the rejected material or product.
        sourceColumn: REJECT_QUANTITY
        sourceTable: PASX.PASXPRODUCTIONUNIT
      SCHEDULED_HOURS:
        type: STRING
        description: Total number of hours the equipment was scheduled for use.
        sourceColumn: SCHEDULED_HOURS
        sourceTable: PASX.PR_EBR_AVAILABLE_MAT_IN_ITEM
      DURATION_MINUTES:
        type: STRING
        description: Duration of the process step in minutes, calculated from start and
          end times.
        sourceColumn: DURATION_MINUTES
        sourceTable: PASX.calculated
      PREV_OPERATION_END:
        type: DATETIME
        description: End time of the previous operation performed on the same equipment.
        sourceColumn: PREV_OPERATION_END
        sourceTable: PASX.calculated
      UNPLANNED_DOWNTIME:
        type: STRING
        description: Duration of unplanned equipment downtime in hours.
        sourceColumn: UNPLANNED_DOWNTIME
        sourceTable: PASX.PR_EBR_AVAILABLE_MAT_IN_ITEM
      UTILIZATION_PERCENT:
        type: STRING
        description: Utilization percentage of the equipment.
        sourceColumn: UTILIZATION_PERCENT
        sourceTable: PASX.PR_EBR_AVAILABLE_MAT_IN_ITEM
      EQUIPMENT_IDLE_MINUTES:
        type: STRING
        description: Idle time of equipment in minutes between consecutive operations.
        sourceColumn: EQUIPMENT_IDLE_MINUTES
        sourceTable: PASX.calculated
